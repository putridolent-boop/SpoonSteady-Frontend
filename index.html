
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpoonSteady - Pemantau Tremor & Makan</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>SpoonSteady 🥣</h2>

    <p>Status:
      <b id="mqttStatus" class="offline">Terputus (Offline)</b>
    </p>

    <div class="btn-group">
      <button id="btnRole1" class="role-btn active" onclick="pilihMode('sensor')">
        📱 HP 1 (Sendok)
      </button>

      <button id="btnRole2" class="role-btn" onclick="pilihMode('monitor')">
        🍽️ HP 2 (Meja)
      </button>
    </div>

    <button id="btnStart" class="action-btn" onclick="mulaiSistem()">
      Mulai Sistem
    </button>
  </div>

  <div id="panelSensor" class="card">
    <h3>Data Gerakan HP 1</h3>

    <p>Getaran (RMS):</p>
    <div class="val-box" id="dispRms">0.00 m/s²</div>

    <p>Sudut Suapan (Kemiringan):</p>
    <div class="val-box" id="dispPitch">0°</div>
  </div>

  <div id="panelMonitor" class="card" style="display: none;">
    <h3>Pantauan Meja HP 2</h3>

    <p>Skor Kestabilan:</p>
    <div class="val-box" id="dispScore">100%</div>

    <p>Total Suapan:</p>
    <div class="val-box" id="dispScoop">0 Kali</div>
  </div>

  <div class="card">
    <h3>Log Aktivitas</h3>
    <div class="log-area" id="logBox">
      Menunggu sistem dimulai...
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
